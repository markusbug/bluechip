# Runs the fund's automation on mainnet:
#   keeper        every 10 minutes during the US session: activates a due index, makes one trade.
#   index-update  weekly: recomputes float shares from SEC filings and proposes them if they moved.
#
# Off until the repository variable AUTOMATION_ENABLED is "true" (set it after the mainnet deploy).
# Secrets: KEEPER_KEY (a wallet with a little ETH on Base, nothing else), UPDATER_KEY (the
# rebalancer's updater; its proposals wait 7 days and the owner can cancel them), BASE_RPC_URL
# (optional). Variable: SEC_USER_AGENT ("Name email", as SEC asks of automated clients).
name: automation

on:
  schedule:
    - cron: "*/10 14-19 * * 1-5"
    - cron: "0 15 * * 1"
  workflow_dispatch:
    inputs:
      job:
        description: "keeper or index-update"
        required: true
        default: keeper

concurrency:
  group: automation-${{ github.event.schedule || inputs.job }}
  cancel-in-progress: false

jobs:
  keeper:
    if: vars.AUTOMATION_ENABLED == 'true' && (github.event.schedule == '*/10 14-19 * * 1-5' || inputs.job == 'keeper')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node scripts/keeper.mjs --chain 8453
        env:
          KEEPER_KEY: ${{ secrets.KEEPER_KEY }}
          RPC_URL: ${{ secrets.BASE_RPC_URL }}

  index-update:
    if: vars.AUTOMATION_ENABLED == 'true' && (github.event.schedule == '0 15 * * 1' || inputs.job == 'index-update')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node scripts/index-update.mjs --chain 8453
        env:
          UPDATER_KEY: ${{ secrets.UPDATER_KEY }}
          RPC_URL: ${{ secrets.BASE_RPC_URL }}
          SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT }}
