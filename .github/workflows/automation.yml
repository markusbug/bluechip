# Keeps the fund on its index without anyone at the keyboard:
#   keeper        every 10 minutes during the US session: activates a due index update and makes at
#                 most one rebalancing trade. On a testnet mock deployment it also refreshes the
#                 mock price feeds.
#   index-update  Mondays: recomputes float shares from SEC filings and proposes them if they moved.
#
# Each job runs for the chains listed in a repository variable (space-separated), and does nothing
# while it is empty:
#   KEEPER_CHAINS  e.g. "84532" (Base Sepolia), later "84532 8453" (plus Base mainnet)
#   INDEX_CHAINS   e.g. "8453"
# and for each fund in FUNDS (default "blue"; with BLUEAI live, "blue blueai"). A (chain, fund) pair
# without a committed deployment file (contracts/deployments/<chainId>.json for blue,
# <chainId>-<fund>.json otherwise) is skipped. Every fund uses the same keeper and updater wallets.
#
# Secrets: KEEPER_KEY (a wallet holding only gas money), UPDATER_KEY (the rebalancer's updater:
# its proposals wait 7 days and the owner can cancel them), BASE_RPC_URL and BASE_SEPOLIA_RPC_URL
# (optional; the public RPCs rate-limit). Variable SEC_USER_AGENT: "Name email", as SEC asks.
name: automation

on:
  schedule:
    - cron: "*/10 14-19 * * 1-5"
    - cron: "0 15 * * 1"
  workflow_dispatch:
    inputs:
      job:
        description: "keeper or index-update"
        required: true
        default: keeper

concurrency:
  group: automation-${{ github.event.schedule || inputs.job }}
  cancel-in-progress: false

jobs:
  keeper:
    if: vars.KEEPER_CHAINS != '' && (github.event.schedule == '*/10 14-19 * * 1-5' || inputs.job == 'keeper')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: keeper
        env:
          CHAINS: ${{ vars.KEEPER_CHAINS }}
          FUNDS: ${{ vars.FUNDS || 'blue' }}
          KEEPER_KEY: ${{ secrets.KEEPER_KEY }}
          BASE_RPC_URL: ${{ secrets.BASE_RPC_URL }}
          BASE_SEPOLIA_RPC_URL: ${{ secrets.BASE_SEPOLIA_RPC_URL }}
        run: |
          [ -n "$KEEPER_KEY" ] || { echo "::error::KEEPER_KEY is not set"; exit 1; }
          status=0
          for chain in $CHAINS; do
            case $chain in 8453) rpc=$BASE_RPC_URL ;; 84532) rpc=$BASE_SEPOLIA_RPC_URL ;; *) rpc= ;; esac
            for fund in $FUNDS; do
              if [ "$fund" = blue ]; then file=$chain.json; else file=$chain-$fund.json; fi
              [ -f "contracts/deployments/$file" ] || continue
              echo "::group::chain $chain, fund $fund"
              RPC_URL=$rpc node scripts/keeper.mjs --chain "$chain" --fund "$fund" || status=1
              echo "::endgroup::"
            done
          done
          exit $status

  index-update:
    if: vars.INDEX_CHAINS != '' && (github.event.schedule == '0 15 * * 1' || inputs.job == 'index-update')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: index-update
        env:
          CHAINS: ${{ vars.INDEX_CHAINS }}
          FUNDS: ${{ vars.FUNDS || 'blue' }}
          UPDATER_KEY: ${{ secrets.UPDATER_KEY }}
          BASE_RPC_URL: ${{ secrets.BASE_RPC_URL }}
          BASE_SEPOLIA_RPC_URL: ${{ secrets.BASE_SEPOLIA_RPC_URL }}
          SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT }}
        run: |
          [ -n "$UPDATER_KEY" ] || { echo "::error::UPDATER_KEY is not set"; exit 1; }
          status=0
          for chain in $CHAINS; do
            case $chain in 8453) rpc=$BASE_RPC_URL ;; 84532) rpc=$BASE_SEPOLIA_RPC_URL ;; *) rpc= ;; esac
            for fund in $FUNDS; do
              if [ "$fund" = blue ]; then file=$chain.json; else file=$chain-$fund.json; fi
              [ -f "contracts/deployments/$file" ] || continue
              echo "::group::chain $chain, fund $fund"
              RPC_URL=$rpc node scripts/index-update.mjs --chain "$chain" --fund "$fund" || status=1
              echo "::endgroup::"
            done
          done
          exit $status
